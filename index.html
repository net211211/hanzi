<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tim汉字笔画学习器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Noto Serif SC"', 'serif'],
              calligraphy: ['"Ma Shan Zheng"', 'cursive'],
            },
            colors: {
              'ink-black': '#1a1a1a',
              'paper-beige': '#fdfbf7',
              'seal-red': '#b92b27',
              'jade-green': '#4ca887',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #fdfbf7;
        color: #1a1a1a;
      }
      /* Tian Zi Ge Background Pattern */
      .tian-zi-ge {
        background-image: 
          linear-gradient(to right, #b92b27 1px, transparent 1px),
          linear-gradient(to bottom, #b92b27 1px, transparent 1px);
        background-size: 100% 100%; 
        position: relative;
        border: 2px solid #b92b27;
      }
      .tian-zi-ge::before, .tian-zi-ge::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
      }
      /* Diagonal lines for Mi Zi Ge (Optional, using Tian Zi Ge here for simplicity: Vertical/Horizontal center lines) */
      .tian-zi-ge::before {
        border-right: 1px dashed #e68a88;
        left: -50%;
      }
      .tian-zi-ge::after {
        border-bottom: 1px dashed #e68a88;
        top: -50%;
      }
      /* Simple cross dashed lines */
      .cross-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: 
          linear-gradient(to right, transparent 49.5%, #e68a88 49.5%, #e68a88 50.5%, transparent 50.5%),
          linear-gradient(to bottom, transparent 49.5%, #e68a88 49.5%, #e68a88 50.5%, transparent 50.5%);
      }
    </style>
<script type="importmap">

</html>
